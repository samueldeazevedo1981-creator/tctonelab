r-color:var(--gold);outline:none}.photo{height:145px;overflow:hidden;position:relative;background:#120f0e}.photo img{position:absolute;left:0;bottom:0;width:100%;height:auto;min-height:100%;object-fit:cover}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#120f0eaa)}.card b{display:block;padding:12px 16px 15px}.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{background:#161413;border:1px solid #514033;border-radius:12px;color:var(--text);text-align:left;padding:19px;font-weight:650;transition:.2s}.choice small{display:block;font-weight:400;color:var(--muted);margin-top:4px}.search{width:100%;padding:13px 16px;border-radius:10px;background:#100e0d;border:1px solid #695038;color:var(--text);margin-bottom:16px}.back{background:none;border:0;color:var(--gold);padding:8px 0;margin-bottom:10px}.tag{display:inline-block;border:1px solid #775837;color:var(--gold);border-radius:6px;padding:5px 9px;font-size:.84rem;margin:8px 6px 8px 0}.recipe{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.block{background:#141211;border:1px solid #3d3128;border-radius:12px;padding:18px}.block h3{color:var(--gold);margin:0 0 8px;font-size:1rem}.block p{color:var(--muted)}.block strong{color:var(--text)}.wide{grid-column:1/-1}.chain{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chain span{padding:8px 11px;border-radius:8px;background:#352719;color:#f7d7a6;font-size:.88rem}.note{font-size:.88rem;color:var(--muted);margin-top:20px}.hidden{display:none!important}@media(max-width:760px){main{padding:24px 15px 60px}section{padding:18px}.grid,.choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.recipe{grid-template-columns:1fr}.wide{grid-column:auto}.photo{height:110px}}@media(max-width:480px){.grid,.choicegrid{grid-template-columns:1fr 1fr}.card{min-height:136px}.photo{height:92px}.card b{font-size:.9rem;padding:10px}header img{width:52px;height:52px}header strong{font-size:1rem}.choice{padding:14px}}
</style></head><body><header><div class="inner"><img src="assets/logo.png" alt="Boné Trucker Cap Tone Lab"><div><strong>Trucker Cap Tone Lab</strong><span>Guitarra Fora da Caixa</span></div></div></header><main><div class="top"><div><div class="eyebrow">Guia de timbres</div><h1>Encontre um caminho para o seu som.</h1><p class="intro">Escolha sua pedaleira, um estilo e um guitarrista. Monte a cadeia e ajuste pelo ouvido.</p></div></div><nav class="steps" aria-label="Etapas"><span class="active">1 · Pedaleira</span><span>2 · Estilo</span><span>3 · Guitarrista</span><span>4 · Configuração</span></nav><section id="app" aria-live="polite"></section></main><script>
const pedals=[['Boss GT-10','gt10.png'],['Boss GT-100','gt100.png'],['Line 6 POD HD500','hd500.png'],['M-Vave Tank G','tankg.png'],['M-Vave Black Box','blackbox.png'],['M-Vave MK300','mk300.png'],['Sonicake Matribox 2 Pro','matribox.png'],['Valeton GP-200','gp200.png']];
const genres=['Rock clássico','Hard rock','Pop rock','Blues','Blues rock','Country','Country rock','Fusion','Funk e soul','Jazz','Metal','Worship','Gospel brasileiro','Rock brasileiro','Pop brasileiro','MPB','Sertanejo','Forró e xote','Samba e pagode','Axé'];
const players=['Kiko (Roupa Nova)','Eddie Van Halen','Steve Lukather','Brian May','Stevie Ray Vaughan','David Gilmour','Andy Wood','Brent Mason','Johnny Hiland','Dann Huff','Jeff Beck','Nuno Bettencourt','Greg Howe','John Mayer','Eric Johnson','Eric Clapton','Joe Bonamassa','Jimi Hendrix','Slash','Angus Young','Jimmy Page','Ritchie Blackmore','Tony Iommi','Nile Rodgers','Cory Wong','Mark Lettieri','John Frusciante','The Edge','Mateus Asato','Lincoln Brewster','Juninho Afram','Pepeu Gomes','Lulu Santos','Frejat','Kiko Loureiro','Guthrie Govan','Scott Henderson','Robben Ford','Larry Carlton','Brad Paisley','Albert Lee','George Benson','Yngwie Malmsteen'];
const families={country:{amp:'Clean americano com bastante headroom',cab:'Caixa aberta 1×12 ou 2×12',drive:'Overdrive leve, opcional',comp:'Compressão moderada, preserve o ataque',delay:'Slapback de 90–130 ms, 1 repetição, mix discreto',reverb:'Room ou spring curto',gain:'2–3/10',eq:'Graves 5 · Médios 5 · Agudos 6'},blues:{amp:'Combo vintage no limite do breakup',cab:'Caixa aberta 1×12 ou 2×12',drive:'Overdrive suave para empurrar o amp',comp:'Leve ou desligado',delay:'Curto e discreto, opcional',reverb:'Spring moderado',gain:'4–5/10',eq:'Graves 5 · Médios 6 · Agudos 5'},rock:{amp:'Britânico crunch ou high gain conforme a música',cab:'4×12, comece pelo falante com médios definidos',drive:'Boost antes do amp para solos',comp:'Desligado ou leve',delay:'Solo: 320–420 ms, poucas repetições',reverb:'Plate curto',gain:'5–7/10',eq:'Graves 5 · Médios 6 · Agudos 5'},ambient:{amp:'Clean com headroom',cab:'2×12 aberta ou 4×12 suave',drive:'Drive transparente em camadas, opcional',comp:'Leve para nivelar',delay:'Colcheia pontuada ou 1/4 no tempo da música',reverb:'Hall amplo; controle o mix na banda',gain:'2–4/10',eq:'Graves 5 · Médios 5 · Agudos 5'},funk:{amp:'Clean brilhante e dinâmico',cab:'1×12 ou 2×12 aberta',drive:'Desligado ou leve',comp:'Moderado para a base rítmica',delay:'Desligado ou sutil',reverb:'Room curto',gain:'2/10',eq:'Graves 4 · Médios 5 · Agudos 6'}};

const profiles={
'Brent Mason':{amp:'Fender Twin Reverb',cab:'2×12 aberta',drive:'Ibanez Tube Screamer, bem leve',comp:'Compressor de estúdio, ataque preservado',delay:'Slapback 110 ms · feedback 10% · mix 12%',reverb:'Spring · mix 12%',gain:'22/100',eq:'Bass 48 · Mid 52 · Treble 62',tip:'Telecaster: experimente captador da ponte, mas abra o tone se o ataque ficar áspero.',source:'Referência sonora country. A cadeia é uma aproximação, não o rig único do artista.'},
'Andy Wood':{amp:'Suhr PT100 ou clean americano',cab:'2×12 aberta para country; 4×12 para rock',drive:'Wampler Gearbox / overdrive leve',comp:'Suhr Woodshed Compressor, compressão leve',delay:'Slapback 125 ms · mix 11%',reverb:'Room · mix 10%',gain:'30/100',eq:'Bass 48 · Mid 58 · Treble 57',tip:'No country, reduza a compressão até a palhetada voltar a respirar.',source:'Woodshed e Gearbox aparecem nas referências do próprio Andy; demais escolhas são ponto de partida.'},

'Eddie Van Halen':{amp:'Peavey 5150 / EVH 5150 ou Marshall plexi conforme a fase',cab:'4×12 com Greenback ou V30',drive:'Boost discreto; evite saturar o pré demais',comp:'Desligado',delay:'Digital 300 ms · mix 13%',reverb:'Plate curto · mix 9%',gain:'62/100',eq:'Bass 48 · Mid 64 · Treble 56',tip:'Para o som brown, deixe a palhetada e o volume da guitarra controlarem a resposta.',source:'Fases distintas pedem amps distintos; escolha a fase antes de atribuir um rig.'},
'Brian May':{amp:'Vox AC30 Top Boost',cab:'2×12 com falantes tipo Alnico Blue',drive:'Treble booster antes do amp',comp:'Desligado',delay:'Digital 800 ms para harmonias; desligue na base',reverb:'Room curto · mix 8%',gain:'55/100',eq:'Bass 35 · Mid 64 · Treble 66',tip:'Baixe o volume da guitarra para limpar; o booster e a mão mudam o timbre.',source:'AC30 e treble booster são a referência central; parâmetros são aproximação.'},
'Stevie Ray Vaughan':{amp:'Fender Vibroverb / Super Reverb',cab:'2×12 ou 4×10 aberta',drive:'Ibanez Tube Screamer para empurrar o amp',comp:'Desligado',delay:'Desligado',reverb:'Spring · mix 15%',gain:'43/100',eq:'Bass 47 · Mid 60 · Treble 55',tip:'Menos ganho deixa as cordas e a mão direita aparecerem.',source:'Famílias de equipamentos associadas ao artista; ajuste por gravação.'},
'David Gilmour':{amp:'Hiwatt DR103 clean',cab:'4×12 Fane ou IR equivalente',drive:'Big Muff para sustain; boost para solos',comp:'Compressor leve',delay:'Digital 420 ms · feedback 25% · mix 24%',reverb:'Plate · mix 18%',gain:'29/100',eq:'Bass 51 · Mid 53 · Treble 56',tip:'Ative o fuzz apenas no solo e controle a ambiência com o tempo da música.',source:'Referência de rig por fase; não corresponde a toda a discografia.'},
'Steve Lukather':{amp:'Mesa/Boogie Mark ou Bogner Ecstasy',cab:'4×12 V30',drive:'Overdrive como boost de médios',comp:'Leve',delay:'Digital 360 ms · mix 19%',reverb:'Plate · mix 14%',gain:'57/100',eq:'Bass 48 · Mid 62 · Treble 52',tip:'Se o solo embolar, corte graves do delay antes de aumentar o ganho.',source:'Varia entre eras e produções; esta é uma direção de lead.'},
'Kiko (Roupa Nova)':{amp:'Marshall crunch ou Bogner de médio ganho',cab:'4×12 Greenback ou V30',drive:'Overdrive médio para destacar o solo',comp:'Leve',delay:'Digital 330 ms · mix 17%',reverb:'Plate · mix 12%',gain:'53/100',eq:'Bass 47 · Mid 64 · Treble 54',tip:'Teste com o arranjo da música: médios ajudam o solo a aparecer sem exagerar no volume.',source:'Direção de timbre para estudo, não atribuição de equipamento usado por Kiko.'},
'Brent Mason':null};
profiles['Brent Mason']={amp:'Fender Twin Reverb',cab:'2×12 aberta',drive:'Tube Screamer, drive quase zerado',comp:'Compressor moderado',delay:'Slapback 110 ms · mix 12%',reverb:'Spring · mix 12%',gain:'22/100',eq:'Bass 48 · Mid 52 · Treble 62',tip:'Na Telecaster, controle o agudo no tone antes de trocar todo o preset.',source:'Direção country inspirada no artista; equipamento varia por sessão.'};
Object.assign(profiles,{
'Nuno Bettencourt':{amp:'Marshall de alto ganho',cab:'4×12 Greenback',drive:'Boost leve, sem excesso de ganho',comp:'Desligado',delay:'Digital 310 ms · mix 12%',reverb:'Room · mix 9%',gain:'64/100',eq:'Bass 45 · Mid 65 · Treble 55',tip:'Ritmo seco e mão direita articulada fazem mais diferença que ganho no máximo.',source:'Direção para rock de Nuno; rig varia por época.'},
'Dann Huff':{amp:'Bogner / Marshall de médio ganho',cab:'4×12 V30',drive:'Overdrive para empurrar médios',comp:'Leve',delay:'Digital 340 ms · mix 16%',reverb:'Plate · mix 12%',gain:'48/100',eq:'Bass 46 · Mid 62 · Treble 54',tip:'Compare base e solo no contexto da banda antes de subir ganho.',source:'Direção de guitarra de estúdio inspirada no artista.'},
'John Mayer':{amp:'Fender Deluxe / Dumble clean',cab:'2×12 aberta',drive:'Tube Screamer leve',comp:'Leve',delay:'Slapback discreto · mix 9%',reverb:'Spring · mix 14%',gain:'34/100',eq:'Bass 48 · Mid 55 · Treble 53',tip:'Deixe espaço para a dinâmica dos dedos e da palheta.',source:'Referência de fase blues/pop, sem atribuição de rig único.'},
'Slash':{amp:'Marshall JCM800 / Silver Jubilee',cab:'4×12 V30',drive:'Boost moderado',comp:'Desligado',delay:'Digital 350 ms · mix 14%',reverb:'Plate · mix 10%',gain:'61/100',eq:'Bass 52 · Mid 66 · Treble 54',tip:'Afine os médios antes de procurar mais distorção.',source:'Aproximação de lead hard rock.'},
'The Edge':{amp:'Vox AC30 clean',cab:'2×12 Alnico',drive:'Overdrive baixo, opcional',comp:'Leve',delay:'Colcheia pontuada sincronizada · mix 27%',reverb:'Hall · mix 18%',gain:'28/100',eq:'Bass 43 · Mid 51 · Treble 61',tip:'O tempo do delay faz parte do riff: ajuste ao BPM da música.',source:'Aproximação de um dos timbres rítmicos do artista.'},
'Lincoln Brewster':{amp:'Clean americano / crunch leve',cab:'2×12 aberta',drive:'Overdrive leve',comp:'Moderado',delay:'Colcheia pontuada · mix 22%',reverb:'Hall · mix 23%',gain:'37/100',eq:'Bass 47 · Mid 53 · Treble 57',tip:'Diminua o reverb quando a banda e o ambiente já soarem grandes.',source:'Receita worship inspirada no estilo, não rig documentado.'},
'Yngwie Malmsteen':{amp:'Marshall plexi no limite',cab:'4×12 Greenback',drive:'DOD-style overdrive / boost',comp:'Desligado',delay:'Digital 300 ms · mix 15%',reverb:'Plate · mix 11%',gain:'57/100',eq:'Bass 42 · Mid 67 · Treble 57',tip:'O boost firma o ataque; ganho demais pode apagar a definição.',source:'Aproximação de timbre neo clássico.'}
});
const deviceModels={
'Boss GT-10':{clean:'Clean TWIN',edge:'Tweed',brit:'MS1959 (I+II)',vox:'VO Drive',high:'5150 Drive',drive:'T Scream',fuzz:'MUFF Fuzz',comp:'COMP',cab:'2×12 ou 4×12 em Speaker Simulator',source:'Manual BOSS GT-10'},
'Boss GT-100':{clean:'CLEAN TWIN',edge:'TWEED',brit:'MS1959 I+II',vox:'VO DRIVE',high:'5150 DRIVE',drive:'T-SCREAM',fuzz:'MUFF FUZZ',comp:'COMP',cab:'SP TYPE: 2×12 ou 4×12',source:'Guia BOSS GT-100'},
'Line 6 POD HD500':{clean:'Blackface Double',edge:'Blackface Deluxe',brit:'Brit J-800',vox:'Class A-30 TB',high:'Treadplate',drive:'Screamer',fuzz:'Fuzz Pi',comp:'Red Comp',cab:'2×12 Blackface Double ou 4×12 Greenback 25',source:'Guia Line 6 POD HD500'},
'Sonicake Matribox 2 Pro':{clean:'Captura de Fender Twin / clean americano',edge:'Captura de Fender Deluxe',brit:'Captura de Marshall Plexi',vox:'Captura de Vox AC30',high:'Captura de EVH 5150',drive:'Overdrive tipo Tube Screamer',fuzz:'Fuzz tipo Big Muff',comp:'Compressor',cab:'IR 2×12 ou 4×12 correspondente',source:'Referências de captura/IR, não nomes internos confirmados'},
'M-Vave MK300':{clean:'Amp clean tipo Fender Twin',edge:'Amp tipo Fender Deluxe',brit:'Amp tipo Marshall Plexi',vox:'Amp tipo Vox AC30',high:'Amp tipo 5150',drive:'M-VAVE TS',fuzz:'Fuzz tipo Big Muff',comp:'Compressor',cab:'CAB / IR compatível com o amp',source:'M-VAVE TS conferido; demais nomes são alvos sonoros até catalogar o firmware'},
'M-Vave Tank G':{clean:'Captura AM3 de Fender Twin',edge:'Captura AM3 de Fender Deluxe',brit:'Captura AM3 de Marshall Plexi',vox:'Captura AM3 de Vox AC30',high:'Captura AM3 de EVH 5150',drive:'Boost externo opcional',fuzz:'Fuzz externo opcional',comp:'Compressor externo opcional',cab:'IR importado 2×12 ou 4×12',source:'Requer capturas/IRs instalados; efeitos externos não são blocos da Tank G'},
'M-Vave Black Box':{clean:'Captura clean estilo Fender Twin',edge:'Captura estilo Fender Deluxe',brit:'Captura estilo Marshall Plexi',vox:'Captura estilo Vox AC30',high:'Captura estilo 5150',drive:'FX de overdrive / captura',fuzz:'Fuzz / captura',comp:'FX compressor',cab:'CAB / IR correspondente',source:'Nomes das capturas dependem do conteúdo instalado'},
'Valeton GP-200':{clean:'Amp tipo Fender Twin',edge:'Amp tipo Fender Deluxe',brit:'Amp tipo Marshall Plexi',vox:'Amp tipo Vox AC30',high:'Amp tipo 5150',drive:'Overdrive tipo Tube Screamer',fuzz:'Fuzz tipo Big Muff',comp:'Compressor',cab:'CAB 2×12 ou 4×12 correspondente',source:'Nomes exatos no firmware GP-200 ainda em conferência'}
};
function tailored(){let base=families[styleKey()],profile=profiles[state.player]||null;let f={...base,...profile};let d=deviceModels[state.pedal],a=(f.amp+' '+state.player).toLowerCase();let key=/vox|ac30|brian may/.test(a)?'vox':/5150|van halen|metal/.test(a)?'high':/marshall|plexi|bogner|lukather|kiko/.test(a)?'brit':/deluxe|vibroverb|blues/.test(a)?'edge':'clean';return {f,d,model:d[key],drive:/muff|fuzz/i.test(f.drive)?d.fuzz:d.drive,profile:!!profile}}
let state={step:0,pedal:null,genre:null,player:null};const app=document.getElementById('app');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(step){state.step=step;render();window.scrollTo({top:0,behavior:'smooth'})}function selectPedal(i){state.pedal=pedals[i][0];go(1)}function selectGenre(i){state.genre=genres[i];go(2)}function selectPlayer(i){state.player=players[i];go(3)}function styleKey(){let s=state.genre.toLowerCase();if(s.includes('country')||s.includes('sertanejo'))return 'country';if(s.includes('blues')||s.includes('jazz')||s.includes('mpb'))return 'blues';if(s.includes('worship')||s.includes('gospel')||s.includes('pop'))return 'ambient';if(s.includes('funk')||s.includes('samba')||s.includes('axé')||s.includes('forró'))return 'funk';return 'rock'}function render(){document.querySelectorAll('.steps span').forEach((el,i)=>el.classList.toggle('active',i===state.step));let back=state.step?`<button class="back" onclick="go(${state.step-1})">← Voltar</button>`:'';if(state.step===0)app.innerHTML=`<h2>Qual é a sua pedaleira?</h2><p class="hint">Escolha o equipamento que você vai usar.</p><div class="grid">${pedals.map((p,i)=>`<button class="card" onclick="selectPedal(${i})" aria-label="Escolher ${safe(p[0])}"><div class="photo"><img src="assets/${p[1]}" alt="" loading="lazy"></div><b>${safe(p[0])}</b></button>`).join('')}</div>`;if(state.step===1)app.innerHTML=back+`<h2>Que estilo você quer tocar?</h2><p class="hint">Sua pedaleira: ${safe(state.pedal)}</p><div class="choicegrid">${genres.map((g,i)=>`<button class="choice" onclick="selectGenre(${i})">${safe(g)}</button>`).join('')}</div>`;if(state.step===2)app.innerHTML=back+`<h2>Na praia de qual guitarrista?</h2><p class="hint">Escolha uma referência para ${safe(state.genre)}. Você também pode escrever outro nome.</p><input id="search" class="search" type="search" placeholder="Buscar ou digitar guitarrista" aria-label="Buscar guitarrista"><div class="choicegrid" id="players"></div><button class="choice hidden" id="custom" style="margin-top:12px;width:100%"></button>`;if(state.step===2){const input=document.getElementById('search'),list=document.getElementById('players'),custom=document.getElementById('custom');function filter(){let q=input.value.trim(),matches=players.map((p,i)=>[p,i]).filter(([p])=>p.toLocaleLowerCase('pt-BR').includes(q.toLocaleLowerCase('pt-BR')));list.innerHTML=matches.map(([p,i])=>`<button class="choice" onclick="selectPlayer(${i})">${safe(p)}</button>`).join('');custom.classList.toggle('hidden',!q||matches.some(([p])=>p.toLocaleLowerCase('pt-BR')===q.toLocaleLowerCase('pt-BR')));custom.textContent=`Usar “${q}” como referência`;custom.onclick=()=>{state.player=q;go(3)}}input.addEventListener('input',filter);filter()}if(state.step===3){let {f,d,model,drive,profile}=tailored();app.innerHTML=back+`<h2>${safe(state.genre)} · ${safe(state.player)}</h2><span class="tag">${safe(state.pedal)}</span><span class="tag">${profile?'Receita por guitarrista':'Receita por estilo · referência a pesquisar'}</span><p class="hint">${safe(f.source||'Ponto de partida por estilo. Ainda falta conferir o rig do guitarrista.')}</p><div class="chain">${[d.comp,drive,model,d.cab,'Delay','Reverb'].map(x=>`<span>${safe(x)}</span>`).join('')}</div><div class="recipe"><div class="block"><h3>Amp na sua pedaleira</h3><strong>${safe(model)}</strong><p>Referência: ${safe(f.amp)}. Gain ${safe(f.gain)}. EQ inicial: ${safe(f.eq)}.</p></div><div class="block"><h3>Caixa / IR</h3><strong>${safe(d.cab)}</strong><p>Objetivo: ${safe(f.cab)}. Compare o volume de cada IR antes de mexer na equalização.</p></div><div class="block"><h3>Compressor e pedal</h3><p><strong>${safe(d.comp)}:</strong> ${safe(f.comp)}.<br><strong>${safe(drive)}:</strong> ${safe(f.drive)}.</p></div><div class="block"><h3>Delay e reverb</h3><p><strong>Delay:</strong> ${safe(f.delay)}.<br><strong>Reverb:</strong> ${safe(f.reverb)}.</p></div><div class="block wide"><h3>Guitarra Fora da Caixa</h3><p>${safe(f.tip||'Se o som sumir na banda, suba os médios antes do volume. Se perder ataque, reduza compressão e ganho. Ajuste pelo ouvido.')}</p></div></div><p class="note">${safe(d.source)}. Valores são pontos de partida e não regulagens oficiais do artista. ${!profile?'Este guitarrista ainda não tem uma ficha individual pesquisada.':''}</p>`}}
render();
</script></body></html>
